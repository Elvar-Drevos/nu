<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NU.nl Laatste nieuws</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #FF6823;
    --bg: #07080b;
    --card: #11131a;
    --line: rgba(255,255,255,.07);
    --text: #ffffff;
    --muted: rgba(255,255,255,.80);
    --dim: rgba(255,255,255,.55);

    /* Liggend: twee kolommen naast elkaar */
    --pad: 3.4vmin;
    --gap: 3vmin;
    --head-h: 9vmin;
    --logo-h: 7.4vmin;
    --label: 2.6vmin;
    --clock: 3.4vmin;
    --photo-h: 52%;
    --tag: 1.8vmin;
    --title: 3.7vmin;
    --intro: 2.35vmin;
    --title-lines: 3;
  }
  @media (orientation: portrait) {
    :root {
      /* Staand: twee kaarten onder elkaar */
      --pad: 4.5vw;
      --gap: 3.5vw;
      --head-h: 13vw;
      --logo-h: 11.5vw;
      --label: 4.2vw;
      --clock: 5vw;
      --photo-h: 40%;
      --tag: 2.7vw;
      --title: 5vw;
      --intro: 3.35vw;
      --title-lines: 3;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  body {
    font-family: 'DM Sans', sans-serif; cursor: none; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(ellipse 70% 50% at 0% 0%, rgba(255,104,35,.10), transparent 60%),
      radial-gradient(ellipse 60% 50% at 100% 100%, rgba(40,60,140,.12), transparent 60%),
      var(--bg);
  }

  .page {
    position: fixed; inset: 0; padding: var(--pad);
    display: grid; grid-template-rows: var(--head-h) 1fr; gap: var(--gap);
  }

  /* ---------- Kop ---------- */
  header { display: flex; align-items: center; justify-content: space-between; min-width: 0; }
  .brand { display: flex; align-items: center; gap: calc(var(--logo-h) * .32); }
  .brand svg, .brand img { height: var(--logo-h); width: auto; display: block; }
  .brand .label { display: flex; flex-direction: column; gap: .25em; }
  .brand .label b {
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: var(--label); letter-spacing: -.01em; line-height: 1;
  }
  .brand .label span {
    font-family: 'DM Mono', monospace; font-size: calc(var(--label) * .52); letter-spacing: .14em;
    text-transform: uppercase; color: var(--dim);
  }
  .clock {
    font-family: 'DM Mono', monospace; font-weight: 500; font-size: var(--clock); letter-spacing: .02em;
    padding: .28em .75em; border-radius: 999px; background: var(--card); border: 1px solid var(--line);
  }

  /* ---------- Kaarten ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); min-height: 0; }
  @media (orientation: portrait) { .grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }

  .card {
    position: relative; min-height: 0; min-width: 0;
    display: grid; grid-template-rows: var(--photo-h) 1fr;
    background: var(--card); border: 1px solid var(--line);
    border-radius: calc(var(--pad) * .6); overflow: hidden;
    box-shadow: 0 2vmin 6vmin rgba(0,0,0,.35);
    opacity: 0; transform: translateY(2.5vmin);
  }
  .go .card { animation: rise 1100ms cubic-bezier(.2,.8,.2,1) forwards; }
  .go .card:nth-child(2) { animation-delay: 220ms; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .photo { position: relative; overflow: hidden; background: #1a1d24; }
  .photo .img {
    position: absolute; inset: 0; background-size: cover; background-position: center 30%;
    transition: opacity 1200ms ease;
  }
  .photo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(17,19,26,.85) 0%, rgba(17,19,26,0) 38%);
  }
  .badges {
    position: absolute; z-index: 2; left: calc(var(--pad) * .7); bottom: calc(var(--pad) * .55);
    display: flex; align-items: center; gap: .8em;
    font-family: 'DM Mono', monospace; font-size: var(--tag); letter-spacing: .08em; text-transform: uppercase;
  }
  .tag { background: var(--accent); color: #fff; padding: .45em .95em; border-radius: 999px; font-weight: 500; }
  .time { color: var(--muted); text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .num {
    position: absolute; z-index: 2; top: calc(var(--pad) * .55); right: calc(var(--pad) * .7);
    font-family: 'DM Mono', monospace; font-size: var(--tag); color: #fff; letter-spacing: .1em;
    background: rgba(7,8,11,.55); padding: .4em .7em; border-radius: .6em;
  }

  .text {
    min-height: 0; display: flex; flex-direction: column;
    padding: calc(var(--pad) * .6) calc(var(--pad) * .7) calc(var(--pad) * .7);
  }
  .title {
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: var(--title); line-height: 1.14; letter-spacing: -.015em;
    margin-bottom: .55em; text-wrap: balance;
    display: -webkit-box; -webkit-line-clamp: var(--title-lines); -webkit-box-orient: vertical; overflow: hidden;
    flex: 0 0 auto;
  }
  .intro {
    position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
    font-size: var(--intro); line-height: 1.5; color: var(--muted);
  }
  .intro.scrolls {
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 80%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 0%, #000 80%, transparent 100%);
  }
  .intro-inner { transition: opacity 600ms ease; }

  /* nieuwe inhoud zacht laten verschijnen bij verversen */
  .swap { animation: swap 900ms ease; }
  @keyframes swap { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Laden / fout ---------- */
  #status {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin;
    background: var(--bg); transition: opacity 700ms ease;
    font-family: 'DM Mono', monospace; font-size: 2vmin; color: var(--dim); letter-spacing: .08em; text-transform: uppercase;
  }
  #status.hide { opacity: 0; pointer-events: none; }
  .spinner { width: 6vmin; height: 6vmin; border-radius: 50%; border: .6vmin solid rgba(255,255,255,.1); border-top-color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #dbg {
    position: fixed; z-index: 50; right: 1vw; bottom: 1vw; width: min(760px, 70vw); max-height: 40vh; overflow: auto;
    background: rgba(0,0,0,.88); color: #9f9; font: 13px/1.45 'DM Mono', monospace; padding: 10px 12px; border-radius: 8px;
    white-space: pre-wrap; word-break: break-all;
  }

  /* Rustig: zet ANIMATE op false voor een volledig stilstaande pagina */
  .still .card { opacity: 1; transform: none; animation: none !important; }
</style>
</head>
<body>

<div class="page" id="page">
  <header>
    <div class="brand"><span id="logo"></span><div class="label"><b>Laatste nieuws</b><span id="updated">nu.nl</span></div></div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <main class="grid" id="grid"></main>
</div>

<div id="status"><div class="spinner"></div><div id="statusText">Nieuws laden</div></div>

<script>
/* ================= Instellingen ================= */
const FEED_URL     = 'https://www.nu.nl/rss/Algemeen';
const ITEMS        = 2;                // aantal berichten
const ANIMATE      = true;             // false = kaarten verschijnen zonder inkomst-animatie
const REFRESH_MS   = 5 * 60 * 1000;    // elke 5 minuten kijken of er nieuws is
const SCROLL_PAUSE = 4000;             // pauze (ms) voor en na het scrollen van een lange inleiding
const SCROLL_SPEED = 2600;             // ms per regel bij het scrollen
const LOGO_URL     = '';               // leeg = ingebouwd NU.nl-logo

const SOURCES = [
  u => u,
  u => `https://verkeer-proxy.thomas-schorn-zwolle.workers.dev/?url=${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`
];
/* ================================================ */

const DEBUG = /[?&]debug/.test(location.search);
const SRC_NAMES = ['direct', 'eigen proxy', 'allorigins', 'corsproxy'];
const page = document.getElementById('page');
const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
if (!ANIMATE) page.classList.add('still');

let dbgBox = null;
function log(...parts) {
  console.log('[NU.nl]', ...parts);
  if (!DEBUG) return;
  if (!dbgBox) { dbgBox = document.createElement('div'); dbgBox.id = 'dbg'; document.body.appendChild(dbgBox); }
  const line = document.createElement('div');
  line.textContent = new Date().toLocaleTimeString('nl-NL') + '  ' + parts.join(' ');
  dbgBox.appendChild(line);
  while (dbgBox.children.length > 40) dbgBox.firstChild.remove();
  dbgBox.scrollTop = dbgBox.scrollHeight;
}
function short(u) { return String(u).replace(/^https?:\/\/(www\.)?/, '').slice(0, 70); }

/* ---------- Logo en klok ---------- */
const NU_LOGO = `<svg viewBox="0 0 133.57635 119.38008" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NU.nl"><g transform="translate(-41.843256,-10.593749)"><g transform="matrix(5.5649859,0,0,5.5649859,41.843256,3.5039571)"><path fill="#020051" d="m 10.714,1.846 c 4.554,0 8.408,3.007 9.689,7.145 a 3.043,3.043 0 0 0 0,6.018 c -1.281,4.138 -5.135,7.145 -9.69,7.145 C 5.114,22.154 0.572,17.607 0.572,12 0.572,6.392 5.114,1.846 10.715,1.846 Z"/><path fill="none" stroke="#ffffff" stroke-width="0.572" d="m 10.714,1.56 c 4.602,0 8.62,3.012 9.961,7.347 l 0.1,0.317 -0.33,0.05 A 2.757,2.757 0 0 0 18.099,12 a 2.756,2.756 0 0 0 2.346,2.726 l 0.33,0.05 -0.1,0.317 A 10.433,10.433 0 0 1 10.714,22.44 C 4.954,22.44 0.286,17.765 0.286,12 0.286,6.234 4.954,1.56 10.714,1.56 Z"/><path fill="#b50c16" d="m 18.358,11.955 a 2.538,2.538 0 0 1 2.535,-2.539 2.5385,2.5385 0 0 1 0,5.077 2.538,2.538 0 0 1 -2.535,-2.538 z"/><path fill="none" stroke="#ffffff" stroke-width="0.572" d="m 18.072,11.955 a 2.823,2.823 0 0 1 2.821,-2.824 2.824,2.824 0 0 1 0,5.648 2.823,2.823 0 0 1 -2.821,-2.824 z"/><path fill="#ffffff" d="m 3.675,7.92 c 0,-0.155 0.156,-0.323 0.313,-0.323 h 5.968 c 0.165,0 0.272,0.162 0.272,0.322 v 8.2 c 0,0.155 -0.088,0.284 -0.272,0.284 h -2.42 c -0.162,0 -0.24,-0.113 -0.24,-0.285 v -6.1 c 0,-0.427 -0.69,-0.416 -0.69,10e-4 v 6.1 a 0.282,0.282 0 0 1 -0.28,0.284 H 3.988 c -0.167,0 -0.313,-0.111 -0.313,-0.285 z m 7.243,8.215 c 0,0.154 0.026,0.268 0.182,0.268 h 5.969 c 0.165,0 0.23,-0.109 0.23,-0.268 v -8.2 c 0,-0.155 -0.046,-0.338 -0.23,-0.338 h -2.42 c -0.162,0 -0.282,0.167 -0.282,0.338 v 6.102 c 0,0.426 -0.69,0.415 -0.69,-0.002 v -6.1 c 0,-0.165 -0.09,-0.338 -0.239,-0.338 H 11.1 c -0.166,0 -0.182,0.165 -0.182,0.338 z m 10.255,-3.156 h -0.392 v -0.757 c 0,-0.16 -0.009,-0.264 -0.025,-0.31 a 0.216,0.216 0 0 0 -0.083,-0.11 0.23,0.23 0 0 0 -0.135,-0.04 0.314,0.314 0 0 0 -0.183,0.056 0.285,0.285 0 0 0 -0.111,0.148 c -0.02,0.061 -0.03,0.175 -0.03,0.34 v 0.672 h -0.391 v -1.483 h 0.363 v 0.218 a 0.593,0.593 0 0 1 0.489,-0.251 0.58,0.58 0 0 1 0.237,0.047 0.388,0.388 0 0 1 0.239,0.284 c 0.015,0.061 0.022,0.15 0.022,0.264 v 0.921 m 0.399,0 v -2.047 h 0.392 v 2.047 h -0.392"/></g></g></svg>`;
document.getElementById('logo').innerHTML = LOGO_URL ? `<img src="${LOGO_URL}" alt="NU.nl">` : NU_LOGO;
function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
}
tick(); setInterval(tick, 1000);

/* ---------- Ophalen ---------- */
let workingSource = null;

async function fetchText(url, timeout = 8000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    return await r.text();
  } finally { clearTimeout(t); }
}

async function fetchVia(url, check, timeout = 8000) {
  const order = workingSource ? [workingSource, ...SOURCES.filter(s => s !== workingSource)] : SOURCES;
  for (const make of order) {
    const name = SRC_NAMES[SOURCES.indexOf(make)] || '?';
    try {
      const txt = await fetchText(make(url), timeout);
      if (check(txt)) { workingSource = make; return txt; }
      log('onverwacht antwoord', name, short(url));
    } catch (e) { log('mislukt', name, short(url), '→', (e && (e.name === 'AbortError' ? 'timeout' : e.message)) || 'fout'); }
  }
  throw new Error('niet bereikbaar');
}

const FEED_FALLBACKS = [FEED_URL, 'https://www.nu.nl/rss'];
const MEMO_KEY = 'nunl-feed-v1';
let memo = null;
try { memo = JSON.parse(localStorage.getItem(MEMO_KEY)); } catch (e) {}
if (memo && memo.feed === FEED_URL && SOURCES[memo.src]) workingSource = SOURCES[memo.src];
else memo = null;

async function getFeed() {
  let tries = [];
  for (const base of [...new Set(FEED_FALLBACKS)]) tries.push({ base, bust: true }, { base, bust: false });
  if (memo) tries = [{ base: memo.base, bust: memo.bust }, ...tries.filter(t => !(t.base === memo.base && t.bust === memo.bust))];
  for (const t of tries) {
    const url = t.bust ? t.base + (t.base.includes('?') ? '&' : '?') + '_=' + Date.now() : t.base;
    try {
      const txt = await fetchVia(url, x => x.includes('<item'), 6000);
      memo = { feed: FEED_URL, base: t.base, bust: t.bust, src: SOURCES.indexOf(workingSource) };
      try { localStorage.setItem(MEMO_KEY, JSON.stringify(memo)); } catch (e) {}
      log('feed geladen via', SRC_NAMES[memo.src] || '?', short(url));
      return parseFeed(txt);
    } catch (e) { /* volgende */ }
  }
  memo = null;
  try { localStorage.removeItem(MEMO_KEY); } catch (e) {}
  throw new Error('Feed niet bereikbaar');
}

function stripHtml(s) {
  const d = document.createElement('div');
  d.innerHTML = s || '';
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}

function parseFeed(xmlText) {
  const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
  return [...xml.querySelectorAll('item')].map(it => {
    const get = tag => it.getElementsByTagName(tag)[0];
    const enc = get('enclosure');
    const media = it.getElementsByTagNameNS('*', 'content')[0] || it.getElementsByTagNameNS('*', 'thumbnail')[0];
    const cats = [...it.getElementsByTagName('category')].map(c => c.textContent.trim()).filter(Boolean);
    return {
      title: stripHtml(get('title')?.textContent),
      intro: stripHtml(get('description')?.textContent),
      date:  new Date(get('pubDate')?.textContent || Date.now()),
      cat:   cats[0] || 'Nieuws',
      img:   enc?.getAttribute('url') || media?.getAttribute('url') || ''
    };
  }).sort((a, b) => b.date - a.date).slice(0, ITEMS);
}

/* ---------- Foto in hoge resolutie ---------- */
function sizeVariants(url) {
  const m = url && url.match(/^(https?:\/\/[^/]+\/m\/)([a-z0-9]+)_([a-z]+)(\d+)(.*)$/i);
  if (!m) return [];
  const [, base, id, kind, , rest] = m;
  return [1920, 1600, 1280, 1024].map(px => `${base}${id}_${kind}${px}${rest}`);
}
function cropRatio(url) {
  const m = url && url.match(/\/m\/[^/]+\/(\d+)\/(\d+)\/(\d+)\/(\d+)(?:\/|$)/);
  return m && +m[4] > 0 ? +m[3] / +m[4] : null;
}
function isDistorted(src, img) {
  const expected = cropRatio(src);
  if (!expected) return false;
  return Math.abs(img.naturalWidth / img.naturalHeight - expected) / expected > 0.04;
}
function loadImage(src, timeout = 6000) {
  return new Promise((res, rej) => {
    const img = new Image();
    const t = setTimeout(() => { img.src = ''; rej(); }, timeout);
    img.onload = () => { clearTimeout(t); img.naturalWidth > 1 ? res(img) : rej(); };
    img.onerror = () => { clearTimeout(t); rej(); };
    img.src = src;
  });
}
async function bestImage(url) {
  let best = '';
  for (const src of [...new Set([...sizeVariants(url), url].filter(Boolean))]) {
    try {
      const img = await loadImage(src);
      if (isDistorted(src, img)) continue;
      best = src;
      if (img.naturalWidth >= 1000) break;
    } catch (e) { /* volgende */ }
  }
  return best;
}

/* ---------- Opbouw ---------- */
function timeAgo(d) {
  const min = Math.round((Date.now() - d) / 60000);
  if (min < 1) return 'zojuist';
  if (min < 60) return `${min} min geleden`;
  const h = Math.round(min / 60);
  if (h < 24) return `${h} uur geleden`;
  return d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function cssUrl(u) { return `url("${u.replace(/"/g, '%22')}")`; }

function cardHtml(a, i) {
  return `
    <div class="photo">
      <div class="img" style='${a.photo ? `background-image:${cssUrl(a.photo)}` : ''}'></div>
      <div class="num">0${i + 1}</div>
      <div class="badges"><span class="tag">${esc(a.cat)}</span><span class="time" data-date="${+a.date}">${timeAgo(a.date)}</span></div>
    </div>
    <div class="text">
      <h2 class="title">${esc(a.title)}</h2>
      <div class="intro"><div class="intro-inner">${esc(a.intro)}</div></div>
    </div>`;
}

let shownKey = '';
function render(items, fresh) {
  const key = items.map(a => a.title).join('|');
  if (key === shownKey) return;
  shownKey = key;
  if (!grid.children.length) {
    grid.innerHTML = items.map((a, i) => `<article class="card">${cardHtml(a, i)}</article>`).join('');
  } else {
    items.forEach((a, i) => {
      const card = grid.children[i];
      if (!card) return;
      card.innerHTML = cardHtml(a, i);
      card.classList.remove('swap'); void card.offsetWidth; card.classList.add('swap');
    });
  }
  document.getElementById('updated').textContent = 'nu.nl · bijgewerkt ' +
    new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  requestAnimationFrame(() => [...grid.children].forEach(setupScroll));
}

// "x min geleden" actueel houden
setInterval(() => document.querySelectorAll('.time[data-date]').forEach(el => el.textContent = timeAgo(new Date(+el.dataset.date))), 30000);

/* ---------- Lange inleiding rustig laten scrollen ---------- */
function setupScroll(card) {
  const box = card.querySelector('.intro');
  const inner = card.querySelector('.intro-inner');
  clearTimeout(card._scroll);
  inner.style.transition = 'none';
  inner.style.transform = 'none';
  const overflow = inner.scrollHeight - box.clientHeight;
  if (overflow <= 4) { box.classList.remove('scrolls'); return; }
  box.classList.add('scrolls');
  const lineH = parseFloat(getComputedStyle(box).lineHeight) || 30;
  const dist = overflow + lineH * .6;
  const dur = Math.max(2500, dist / lineH * SCROLL_SPEED);
  const cycle = () => {
    inner.style.transition = `transform ${dur}ms cubic-bezier(.45,0,.55,1)`;
    inner.style.transform = `translateY(-${dist}px)`;
    card._scroll = setTimeout(() => {
      inner.style.transition = 'opacity 600ms ease';
      inner.style.opacity = '0';
      card._scroll = setTimeout(() => {
        inner.style.transition = 'none';
        inner.style.transform = 'none';
        void inner.offsetWidth;
        inner.style.transition = 'opacity 600ms ease';
        inner.style.opacity = '1';
        card._scroll = setTimeout(cycle, SCROLL_PAUSE);
      }, 700);
    }, dur + SCROLL_PAUSE);
  };
  card._scroll = setTimeout(cycle, SCROLL_PAUSE + 1200);
}
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => [...grid.children].forEach(setupScroll), 300); });

/* ---------- Laden ---------- */
async function load() {
  const items = await getFeed();
  await Promise.all(items.map(async a => { a.photo = await bestImage(a.img); }));
  render(items);
  return items;
}

/* ---------- Yodeck HTML-app ----------
   init_widget = geladen (buiten beeld), start_widget = in beeld.
   De inkomst-animatie start pas als de pagina echt in beeld is. Er is geen vaste looptijd nodig. */
let started = false;
function go() {
  if (started) return;
  started = true;
  page.classList.add('go');
  [...grid.children].forEach(setupScroll);
}
window.init_widget  = () => log('Yodeck: geladen (buiten beeld)');
window.start_widget = () => {
  log('Yodeck: in beeld');
  // opnieuw in beeld: animatie opnieuw en het nieuws bijwerken
  if (started) { started = false; page.classList.remove('go'); void page.offsetWidth; load().catch(() => {}); }
  go();
};
window.stop_widget  = () => log('Yodeck: uit beeld');

async function start() {
  try {
    if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]);
    log('start');
    await load();
    statusEl.classList.add('hide');
    // Buiten Yodeck: animatie starten zodra de pagina zichtbaar is
    setTimeout(() => {
      if (started) return;
      if (document.visibilityState === 'visible') requestAnimationFrame(() => requestAnimationFrame(go));
      else document.addEventListener('visibilitychange', function h() {
        if (document.visibilityState === 'visible') { document.removeEventListener('visibilitychange', h); go(); }
      });
    }, 2500);
  } catch (e) {
    log('fout:', e && e.message);
    statusText.textContent = 'Nieuws niet bereikbaar — opnieuw proberen';
    setTimeout(start, 30000);
  }
}

setInterval(() => load().catch(() => {}), REFRESH_MS);
start();
</script>
</body>
</html>
